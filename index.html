<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12283f">
<title>WorkSync DPR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#12283f;
       min-height:100dvh;display:flex;flex-direction:column}
  header{background:#12283f;color:#fff;padding:18px 20px}
  header .t{font-size:19px;font-weight:700;letter-spacing:-.01em}
  header .s{font-size:12.5px;opacity:.75;margin-top:2px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px}
  .card{background:#fff;border:1px solid #e3e7ec;border-radius:16px;padding:26px 22px;max-width:420px;width:100%;
        box-shadow:0 2px 14px rgba(18,40,63,.06);text-align:center}
  .dot{width:44px;height:44px;border-radius:50%;background:#eaf4ec;display:flex;align-items:center;justify-content:center;
       margin:0 auto 14px;font-size:22px}
  h1{font-size:18px;font-weight:700;margin-bottom:8px}
  p{font-size:14px;line-height:1.55;color:#5a6775}
  .rows{margin-top:20px;text-align:left;border-top:1px solid #eef1f4;padding-top:16px}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0}
  .row span:first-child{color:#5a6775}
  .row span:last-child{font-weight:600}
  .ok{color:#00a63f}.wait{color:#c78b00}
  footer{padding:16px 20px;text-align:center;font-size:11.5px;color:#8a97a5}
</style>
</head>
<body>
<header>
  <div class="t">WorkSync DPR</div>
  <div class="s">Narmada Part-B · Multi-Village Water Supply · Dhar</div>
</header>
<main>
  <div class="card">
    <div class="dot">🔧</div>
    <h1>Portal is being set up</h1>
    <p>The daily progress entry and approval system for the pipe-laying work. Logins will be issued to each site.</p>
    <div class="rows">
      <div class="row"><span>Domain</span><span class="ok">connected</span></div>
      <div class="row"><span>Database</span><span class="wait">in progress</span></div>
      <div class="row"><span>Site logins</span><span class="wait">pending</span></div>
    </div>
  </div>
</main>
<footer>Dineshchandra R Agrawal Infracon Pvt. Ltd.</footer>
</body>
</html>
